name: gercek-veri-guncelle
on:
  schedule:
    - cron: "40 15 * * 1-5"   # iş günleri 18:40 (İstanbul), piyasa kapanışından sonra
  workflow_dispatch: {}
  push:
    paths: ["data/gercek/kap/**", "config/takip.json"]
permissions:
  contents: write
concurrency: { group: guncelle, cancel-in-progress: false }
jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}   # elle/sırada bekleyen çalıştırmalar da en güncel veriyle başlar
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt yfinance
      - name: Veriyi güncelle
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python -m kapsam.cli guncelle
      - name: Raporları yayınla ('rapor' dalı; geçmiş tutulmaz, depo büyümez)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/site && cp -r docs/rapor /tmp/site && touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -q -b rapor
          git config user.name "kapsam-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Raporlar $(date -u +%Y-%m-%d): $(ls *.html | wc -l) sayfa, $(ls *_model.xlsx 2>/dev/null | wc -l) Excel"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" rapor
      - name: "Değişiklikleri kaydet (ana dal — veri ve özetler)"
        run: |
          git config user.name "kapsam-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -r -q --cached --ignore-unmatch 'docs/rapor/*_model.xlsx' 'docs/rapor/[A-Z]*.html' 'docs/rapor/risk/*.gz' docs/rapor/risk/index.html docs/rapor/en
          git add -A data/gercek docs/rapor
          [ -f config/bist_evren.csv ] && git add config/bist_evren.csv
          git diff --cached --quiet && { echo "Değişiklik yok"; exit 0; }
          git commit -q -m "Otomatik veri güncellemesi $(date -u +%Y-%m-%d)"
          # Başka bir çalıştırma araya girdiyse: en güncel main'in üstüne al, çakışmada bu çalıştırmanın ürettiği veri esas.
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git fetch -q origin main
            if ! git rebase -X theirs origin/main; then
              git checkout --theirs -- . && git add -A && GIT_EDITOR=true git rebase --continue
            fi
          done
          exit 1
